[package]
name = "mindscope"
version = "0.1.0"
description = "MindScope - Your digital memory"
authors = ["zixin wang"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
glob = "0.3"
dirs-next = "2"
notify = "7"
xcap = "0.7"
image = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
lru = "0.12"
cocoa = "0.26"
objc = "0.2"
whisper-rs = "0.16"
hound = "3.5"
serde_yaml = "0.9"
regex = "1"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
ndarray = "0.16"
